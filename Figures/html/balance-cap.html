<!doctype html>
<!--
  Figure fig:balance-cap of the thesis (Chapter 3, EndorseRank allowance graph); the source of Figures/balance-cap.pdf.
  LaTeX cannot read HTML: edit this file, then run (from overleaf-github/)
      python Figures/html/render.py Figures/html/balance-cap.html
  See Figures/html/README.md.

  What the figure shows: how one owner-spender pair on one token enters the allowance graph. The latest allowance a*
  of the score window (gold bar) is compared with the owner's balance of the token at the freeze (verdigris bar), both
  in US dollars at the price of the freeze day, and counts as the smaller of the two, a-hat = min(a*, bal) (solid part).
  Four cases, top to bottom: an allowance below the balance counts the allowance; an unlimited allowance counts the
  balance; an owner that holds none of the token at the freeze gives no edge; a latest approval of zero deletes the edge.
  The right-hand column names what is counted in each case: a-hat and, below it, "an edge with this amount" (the first
  two cases; the bars show amounts in US dollars, not edge weights) or "no edge" (the last two).
  Bottom: in the allowance layer of C-PR each capped allowance is also bounded by U, so it enters as min(a-hat, U).
  The bar lengths are illustrations, not data.

  Look (STYLE.md, "Bars of an amount"): flat bars with square ends from a grey zero line. The part of an
  allowance that counts is solid gold; the part that is shown but does not count is the pale gold tint inside a thin
  gold line. The balance is the pale verdigris tint inside a thin verdigris line, so that the solid part is the only
  solid in a row. A thin near-black line with a dot at its top marks the amount that counts across both bars. The row
  of C-PR is a pale plate behind a solid violet bar, its counted part solid violet up to the line at U. Variables are
  in Palatino italic; the bars stand on no track, since an amount has no largest value.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Balance cap</title>
<link rel="stylesheet" href="style.css">
<script src="fig.js"></script>
</head>
<body>
<div class="fig"><svg id="s" width="165mm" height="57mm" viewBox="0 0 165 57"></svg></div>
<script>
const svg = document.getElementById("s"), C = Fig.C;
const E = (tag, a, parent) => Fig.el(parent || svg, tag, a);
// text with $variable$ parts (Palatino italic), #upright Palatino# and _{subscript}: Fig.rich; 2.5 mm = 7.1 pt, the smallest text of the figure
const rich = (x, y, s, o = {}) => Fig.rich(svg, x, y, s, Object.assign({ size: 2.5, fill: C.text }, o));
const X0 = 47, W = 62, BH = 2.6;              // bar area starts at X0 (amount 0) and is W mm long
const LINE = 0.25;                            // the line around a part that is shown but does not count

// header
rich(0, 3.2, "One owner–spender pair on one token; amounts in US dollars at the price of the freeze day", { fill: C.muted });
E("rect", { x: X0 + 0.15, y: 5.6, width: 4.2, height: 2.2, fill: C.allowBg, stroke: C.allow, "stroke-width": LINE });
rich(X0 + 5.6, 7.5, "latest allowance $a$#*#");
E("rect", { x: X0 + 33, y: 5.6, width: 4.2, height: 2.2, fill: C.contractBg, stroke: C.contract, "stroke-width": LINE });
rich(X0 + 38.5, 7.5, "owner’s balance at the freeze");
rich(127, 7.5, "counted", { weight: 700, fill: C.ink });

// one case: a = allowance length (Infinity = unlimited), b = balance length (lengths in mm of the bar area)
function row(y, label, a, b, result, edge) {
  rich(0, y + 2.7, label, { weight: 700, fill: C.ink });
  const aw = a === Infinity ? W : a, m = Math.min(aw, b);
  // the allowance: the part that does not count pale inside a thin line, the part that counts solid
  if (aw > m) E("rect", { x: X0 + m, y, width: aw - m, height: BH, fill: C.allowBg, stroke: C.allow, "stroke-width": LINE });
  if (m > 0) E("rect", { x: X0, y, width: m, height: BH, fill: C.allowBand });
  if (aw === 0) rich(X0 + 1, y + 2.2, "0", { fill: C.allowInk });
  if (a === Infinity) rich(X0 + W + 1.0, y + 2.2, "unlimited", { fill: C.allowInk });
  // the owner's balance
  if (b > 0) E("rect", { x: X0, y: y + BH + 0.9, width: b, height: BH, fill: C.contractBg, stroke: C.contract, "stroke-width": LINE });
  else rich(X0 + 1, y + BH + 3.1, "0", { fill: C.contractInk });
  // zero line of the amounts
  E("path", { d: `M${X0},${y - 0.6} V${y + 2 * BH + 1.8}`, stroke: C.rule, "stroke-width": 0.3 });
  // the amount that counts: a thin line across both bars, a dot at its top
  if (m > 0) {
    E("path", { d: `M${X0 + m},${y - 0.9} V${y + 2 * BH + 1.8}`, stroke: C.ink, "stroke-width": 0.3 });
    E("circle", { cx: X0 + m, cy: y - 0.9, r: 0.5, fill: C.ink });
  }
  rich(127, y + 2.0, result, { weight: 700, fill: edge ? C.allowInk : C.muted });
  rich(127, y + 5.1, edge ? "an edge with this amount" : "no edge", { fill: C.muted });
}
row(11.0, "allowance below the balance", 30, 58, "$â$ = $a$#*#", true);
row(20.6, "unlimited allowance", Infinity, 44, "$â$ = bal", true);
row(30.2, "owner holds none of the token", 52, 0, "$â$ = 0", false);
row(39.8, "latest approval is zero", 0, 40, "$â$ = 0", false);

// C-PR's further bound U: a pale plate behind a solid violet bar
E("rect", { x: 0, y: 48.6, width: 165, height: 8.2, fill: C.plate });
E("rect", { x: 0, y: 48.6, width: 1.3, height: 8.2, fill: C.coupled });
rich(3.2, 54.0, "C-PR’s allowance layer", { weight: 700, fill: C.coupledInk });
E("rect", { x: X0 + 36, y: 52.0, width: 20, height: BH, fill: C.coupledBg, stroke: C.coupled, "stroke-width": LINE });
E("rect", { x: X0, y: 52.0, width: 36, height: BH, fill: C.coupled });
E("path", { d: `M${X0 + 36},${50.2} V${55.4}`, stroke: C.coupledInk, "stroke-width": 0.4 });
rich(X0 + 36.9, 51.6, "$U$", { fill: C.coupledInk });
rich(X0 + 57.4, 54.2, "$â$", { fill: C.coupledInk });
rich(127, 54.2, "min($â$, $U$)", { weight: 700, fill: C.coupledInk });
</script>
</body>
</html>
