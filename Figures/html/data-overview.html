<!doctype html>
<!--
  Figure fig:data-overview of the thesis (Chapter 3, data sources and sampling); the source of Figures/data-overview.pdf.
  LaTeX cannot read HTML: edit this file, then run (from overleaf-github/)
      python Figures/html/render.py Figures/html/data-overview.html
  See Figures/html/README.md.

  What the figure shows: every kind of on-chain record used in the thesis, all from Arbitrum One, on one calendar
  from 1 October 2023 to 30 September 2026. The 18 months from October 2023 to March 2025 are drawn at a compressed
  scale (grey band); the 18 months from April 2025 to September 2026 at full scale. Braces mark scan A (1 Oct 2023 to
  30 Jun 2026; the registered analysis scores all of it) and scan B (July to September 2026: the W1 labels). Dashed
  lines mark the freezes: 31 March 2026 (t1, the W0 freeze) and 30 June 2026 (T_obs, the W1 freeze). Each lane is one
  analysis; each bar is one kind of record (orange = ERC-20 Approval logs, blue = ERC-20 Transfer logs, grey = all logs,
  transaction senders or code read over RPC) placed on the months it covers. Solid bars are inputs to scores, cohorts
  or same-window checks; hatched bars are kept out of the scores (labels counted after a freeze, or the importance from
  user accounts). The LANES list in the script holds the same content as data. Lanes, top to bottom:
  1. Extraction: approval and transfer logs of scan A (Oct 2023 to Jun 2026, input) and scan B (Jul to Sep 2026, held out).
     Every ERC-20 approval and transfer log of the chain; the main analysis reads those of five tokens.
  2. Matched cohort selection: approvals from Jul 2025 to Jun 2026, five tokens, three owners. Contracts that at least
     three owners approved on the five tokens in the twelve months before T_obs.
  3. Same-window analysis, matched cohort (n = 6,443): approvals (EndorseRank; allowance checks) and transfers (AWP;
     transfer and stability checks), Jul 2025 to Jun 2026. Events between contracts; both edge types give C-PR and S-PR.
     RQ1 and the same-window part of RQ4.
  4. Discovery-order test at T_obs and at t1: allowance and transfer edges between contracts (input) and, held out,
     I_A (allowances from user accounts) and I_T (transfers from user accounts), Jul 2025 to Jun 2026; at t1 the
     months Apr 2025 to Mar 2026. The crawls read the edges between contracts; the events of user accounts, which no
     ordering reads, give the importance of a contract and mark the hot contracts. RQ2.
  5. Holdout W0, spender contracts (n = 7,864): approvals and transfers from Apr 2025 to Mar 2026 as score input (and
     the W0 cohort); held out from Apr to Jun 2026: new approval pairs and new senders. Contract spenders with a
     five-token allowance set in the year before t1; labels count every account. RQ3, RQ4.
  6. Registered window W1, spender contracts (n = 7,915): score input Jul 2025 to Jun 2026; held out Jul to Sep 2026:
     pairs and senders. F1 and F2 of rule B on the contract graph's scores; W1 logs extracted after the registration.
     RQ3, RQ5.
  7. Account types and balances: senders (an address that sent a transaction in any block before 1 Oct 2026 is a user
     account), code (eth_getCode and smart-account calls at one pinned block, after the label windows), and transfers of
     the five tokens up to each freeze (owner balances). Transaction senders, addresses without code or with an EIP-7702
     delegation and smart accounts are user accounts; other code is a contract. Balances also take the transfers before
     October 2023.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data overview</title>
<link rel="stylesheet" href="style.css">
<script src="fig.js"></script>
<style>
.wrap { position:relative; width:165mm; }
#chart { display:block; }
.note { position:absolute; left:99.4mm; width:65.6mm; font-size:6.8pt; line-height:1.19; color:#374151; }
.note b { color:#111827; }
.legend2 { display:grid; grid-template-columns:11mm 1fr; row-gap:0.6mm; margin-top:0.6mm; font-size:6.8pt; color:#4B5563; }
.legend2 .k { font-weight:700; color:#111827; }
.legend2 .items { display:flex; flex-wrap:wrap; gap:0.5mm 2.8mm; align-items:center; }
.legend2 .items span { display:inline-flex; align-items:center; gap:1.1mm; }
.sw { display:inline-block; width:5mm; height:2.6mm; border-radius:0.5mm; border:0.3mm solid; }
</style>
</head>
<body>
<div class="fig">
  <div class="wrap" id="wrap">
    <svg id="chart" width="165mm" height="100mm" viewBox="0 0 165 100"></svg>
  </div>
  <div class="legend2">
    <div class="k">Records</div>
    <div class="items">
      <span><i class="sw" style="background:#FDE2B8;border-color:#D97706"></i>ERC-20 Approval logs</span>
      <span><i class="sw" style="background:#D3E2FF;border-color:#2563EB"></i>ERC-20 Transfer logs</span>
      <span><i class="sw" style="background:#E5E7EB;border-color:#6B7280"></i>all logs, transaction senders, or code read over RPC</span>
    </div>
    <div class="k">Bars</div>
    <div class="items">
      <span><svg id="sw-solid" width="5mm" height="2.6mm" viewBox="0 0 5 2.6"></svg>solid: input to scores, cohorts or same-window checks</span>
      <span><svg id="sw-held" width="5mm" height="2.6mm" viewBox="0 0 5 2.6"></svg>hatched: kept out of the scores (labels after a freeze; importance from user accounts)</span>
      <span><svg width="2mm" height="3mm" viewBox="0 0 2 3"><path d="M1,0 V3" stroke="#374151" stroke-width="0.35" stroke-dasharray="0.7 0.5"/></svg>dashed: freeze</span>
    </div>
  </div>
</div>

<script>
// ---- content: one lane per analysis; bars are [from, to] in [year, month] (first day of the month), kind = allow | transfer | other
const LANES = [
  { title: "Extraction.",
    note: "Every ERC-20 approval and transfer log of the chain; the main analysis reads those of five tokens.",
    rows: [{ label: "Logs", kind: "other", bars: [
      { from: [2023, 10], to: [2026, 7], text: "approval and transfer logs (scan A)" },
      { from: [2026, 7], to: [2026, 10], text: "scan B", held: true }] }] },
  { title: "Matched cohort selection.",
    note: "Contracts that at least three owners approved on the five tokens in the twelve months before <i>T</i><sub>obs</sub>.",
    rows: [{ label: "Approval", kind: "allow", bars: [{ from: [2025, 7], to: [2026, 7], text: "five tokens, three owners" }] }] },
  { title: "Same-window analysis, matched cohort (<i>n</i>&nbsp;=&nbsp;6,443).",
    note: "Events between contracts; both edge types give C&#8209;PR and S&#8209;PR. RQ1 and the same-window part of RQ4.",
    rows: [
      { label: "Approval", kind: "allow", bars: [{ from: [2025, 7], to: [2026, 7], text: "EndorseRank; allowance checks" }] },
      { label: "Transfer", kind: "transfer", bars: [{ from: [2025, 7], to: [2026, 7], text: "AWP; transfer and stability checks" }] }] },
  { title: "Discovery-order test at <i>T</i><sub>obs</sub> and at <i>t</i><sub>1</sub>.",
    note: "The crawls read the edges between contracts. The events of user accounts, which no ordering reads, give the importance of a contract and mark the hot contracts. RQ2.",
    rows: [
      { label: "Approval", kind: "allow", bars: [{ from: [2025, 7], to: [2026, 7], text: "allowance edges between contracts" }] },
      { label: "Transfer", kind: "transfer", bars: [{ from: [2025, 7], to: [2026, 7], text: "transfer edges between contracts" }] },
      { label: "Approval", kind: "allow", bars: [{ from: [2025, 7], to: [2026, 7], text: "$I$_{A}: allowances from user accounts", held: true }] },
      { label: "Transfer", kind: "transfer", bars: [{ from: [2025, 7], to: [2026, 7], text: "$I$_{T}: transfers from user accounts", held: true }] }],
    span: { from: [2025, 4], to: [2026, 4], text: "at $t$_{1}: these months" } },
  { title: "Holdout W0, spender contracts (<i>n</i>&nbsp;=&nbsp;7,864).",
    note: "Contract spenders with a five-token allowance set in the year before <i>t</i><sub>1</sub>; labels count every account. RQ3, RQ4.",
    rows: [
      { label: "Approval", kind: "allow", bars: [{ from: [2025, 4], to: [2026, 4], text: "score input; W0 cohort" }, { from: [2026, 4], to: [2026, 7], text: "pairs", held: true }] },
      { label: "Transfer", kind: "transfer", bars: [{ from: [2025, 4], to: [2026, 4], text: "score input" }, { from: [2026, 4], to: [2026, 7], text: "senders", held: true }] }] },
  { title: "Registered window W1, spender contracts (<i>n</i>&nbsp;=&nbsp;7,915).",
    note: "F1 and F2 of rule B on the contract graph's scores; W1 logs extracted after the registration. RQ3, RQ5.",
    rows: [
      { label: "Approval", kind: "allow", bars: [{ from: [2025, 7], to: [2026, 7], text: "score input" }, { from: [2026, 7], to: [2026, 10], text: "pairs", held: true }] },
      { label: "Transfer", kind: "transfer", bars: [{ from: [2025, 7], to: [2026, 7], text: "score input" }, { from: [2026, 7], to: [2026, 10], text: "senders", held: true }] }] },
  { title: "Account types and balances.",
    note: "Transaction senders, addresses without code or with an EIP-7702 delegation and smart accounts are user accounts; other code is a contract. Balances also take the transfers before October 2023.",
    rows: [
      { label: "Senders", kind: "other", bars: [{ from: [2023, 10], to: [2026, 10], text: "sent a transaction in any block before 1 Oct 2026: user account" }] },
      { label: "Code", kind: "other", pinned: "eth_getCode and smart-account calls at one pinned block" },
      { label: "Transfer", kind: "transfer", bars: [{ from: [2023, 10], to: [2026, 7], text: "transfers of the five tokens up to each freeze: owner balances" }] }] },
];

// ---- geometry (mm)
const X0 = 14.0, COMP = 0.72, FULL = 3.82;                 // timeline start; mm per compressed and per full month
const mx = ([y, m]) => { const i = (y - 2023) * 12 + (m - 10); return i <= 18 ? X0 + i * COMP : X0 + 18 * COMP + (i - 18) * FULL; };
const xa = mx([2023, 10]), xq = mx([2025, 4]), xj = mx([2026, 1]), xw = mx([2026, 4]), xt = mx([2026, 7]), xe = mx([2026, 10]);
const HEAD = 11.2, PITCH = 3.9, BAR = 3.25, PAD = 0.85, SPAN = 3.6, FS = 2.4;   // FS: 2.4 mm = 6.8 pt
const COL = { allow: { fill: "#FDE2B8", line: "#D97706", ink: "#7C3F00", label: "#B45309" },
              transfer: { fill: "#D3E2FF", line: "#2563EB", ink: "#1E3A8A", label: "#1D4ED8" },
              other: { fill: "#E5E7EB", line: "#6B7280", ink: "#374151", label: "#4B5563" } };
const svg = document.getElementById("chart"), wrap = document.getElementById("wrap");
const E = (tag, a, txt, parent) => Fig.el(parent || svg, tag, a, txt);

// text with $italic$ and _{subscript} marks
function rich(x, y, s, o, parent) {
  const size = o.size || FS;
  const t = E("text", { x, y, "font-size": size, fill: o.fill || "#1F2937", "text-anchor": o.anchor || "middle", "font-weight": o.weight || 400 }, undefined, parent);
  let shift = 0;
  for (const part of s.split(/(\$[^$]+\$|_\{[^}]+\})/).filter(Boolean)) {
    const ts = Fig.el(t, "tspan", {});
    if (part.startsWith("_{")) { ts.textContent = part.slice(2, -1); ts.setAttribute("font-size", size * 0.72); ts.setAttribute("dy", 0.55); shift = 0.55; continue; }
    if (shift) { ts.setAttribute("dy", -shift); shift = 0; }
    if (part.startsWith("$")) { ts.textContent = part.slice(1, -1); ts.setAttribute("font-style", "italic"); }
    else ts.textContent = part;
  }
  return t;
}
// white box behind a text element (drawn just below it)
function halo(t, padX = 0.6, h = 2.6, yc) {
  const bb = t.getBBox();
  const r = E("rect", { x: bb.x - padX, y: (yc ?? bb.y + bb.height / 2) - h / 2, width: bb.width + 2 * padX, height: h, rx: 0.4, fill: "#fff" });
  t.parentNode.insertBefore(r, t);
}
// hatched rectangle as clipped vector lines (no SVG pattern: Chrome prints patterns as page-size images)
let clipN = 0;
function hatch(parent, x, y, w, h, color, rx) {
  const id = "clip" + (clipN++);
  const cp = E("clipPath", { id }, undefined, Fig.defs(svg));
  E("rect", { x, y, width: w, height: h, rx }, undefined, cp);
  E("rect", { x, y, width: w, height: h, rx, fill: "#fff" }, undefined, parent);
  const g = E("g", { "clip-path": `url(#${id})` }, undefined, parent);
  let d = ""; for (let s = x - h; s < x + w; s += 1.2) d += `M${s},${y + h} L${s + h},${y} `;
  E("path", { d, stroke: color, "stroke-width": 0.26, "stroke-opacity": 0.85 }, undefined, g);
  E("rect", { x, y, width: w, height: h, rx, fill: "none", stroke: color, "stroke-width": 0.4 }, undefined, parent);
}

// ---- notes first, to measure their heights
const PX = 96 / 25.4;
const notes = LANES.map(l => { const d = document.createElement("div"); d.className = "note"; d.innerHTML = `<b>${l.title}</b> ${l.note}`; wrap.appendChild(d); return d; });
const laneTop = [];
let y = HEAD;
LANES.forEach((lane, i) => {
  const rowsH = lane.rows.length * PITCH + (lane.span ? SPAN : 0);
  const noteH = notes[i].offsetHeight / PX;
  const h = Math.max(rowsH, noteH) + 2 * PAD;
  laneTop.push(y);
  notes[i].style.top = (y + PAD - 0.2) + "mm";
  y += h;
});
const BOTTOM = y;

// ---- layers: background, grid, freezes, then bars and labels on top
const gBack = E("g", {}), gBars = E("g", {}), gText = E("g", {});
E("rect", { x: xa, y: HEAD - 0.5, width: xq - xa, height: BOTTOM - HEAD + 0.5, fill: "#F3F4F6" }, undefined, gBack);
for (let i = 0; i <= 18; i++) { const x = xq + i * FULL; E("path", { d: `M${x},${HEAD - 0.5} V${BOTTOM}`, stroke: "#E5E7EB", "stroke-width": 0.2 }, undefined, gBack); }
for (const x of [mx([2024, 1]), mx([2025, 1])]) E("path", { d: `M${x},${HEAD - 0.5} V${BOTTOM}`, stroke: "#D1D5DB", "stroke-width": 0.2 }, undefined, gBack);
laneTop.forEach((top, i) => { if (i) E("path", { d: `M0,${top} H165`, stroke: "#CBD5E1", "stroke-width": 0.25 }, undefined, gBack); });
E("path", { d: `M0,${BOTTOM} H165`, stroke: "#CBD5E1", "stroke-width": 0.25 }, undefined, gBack);
for (const x of [xw, xt]) E("path", { d: `M${x},${HEAD - 0.5} V${BOTTOM + 0.7}`, stroke: "#374151", "stroke-width": 0.38, "stroke-dasharray": "0.9 0.6" }, undefined, gBack);

// header: braces, years, months
function brace(x1, x2, yb, label) {
  const m = (x1 + x2) / 2;
  E("path", { d: `M${x1},${yb + 1} q0,-1 1,-1 H${m - 1} q1,0 1,-1 q0,1 1,1 H${x2 - 1} q1,0 1,1`, fill: "none", stroke: "#374151", "stroke-width": 0.3 });
  rich(m, yb - 1.5, label, { size: FS, fill: "#374151" });
}
brace(xa + 0.2, xt - 0.2, 3.1, "scan A (the registered analysis scores all of it)");
brace(xt + 0.2, xe - 0.2, 3.1, "scan B: W1 labels");
rich((xa + xq) / 2, 7.1, "Oct 2023 – Mar 2025", { size: 2.25, weight: 700 });
rich((xq + xj) / 2, 7.1, "2025", { size: FS, weight: 700 });
rich((xj + xe) / 2, 7.1, "2026", { size: FS, weight: 700 });
rich(xq - 1.5, 10.1, "compressed", { size: 2.2, fill: "#6B7280", anchor: "end" });
"AMJJASONDJFMAMJJAS".split("").forEach((c, i) => rich(xq + (i + 0.5) * FULL, 10.1, c, { size: 2.3, fill: "#374151" }));
E("path", { d: `M${xq - 0.9},10.8 l0.55,-1.5 M${xq - 0.25},10.8 l0.55,-1.5`, stroke: "#6B7280", "stroke-width": 0.3 });

// bars, row labels, the t1 span and the pinned block
function bar(x1, x2, yc, kind, text, held) {
  const c = COL[kind], x = x1 + 0.12, w = x2 - x1 - 0.24, yb = yc - BAR / 2;
  if (held) hatch(gBars, x, yb, w, BAR, c.line, 0.55);
  else E("rect", { x, y: yb, width: w, height: BAR, rx: 0.55, fill: c.fill, stroke: c.line, "stroke-width": 0.3 }, undefined, gBars);
  const t = rich((x1 + x2) / 2, yc + 0.84, text, { size: FS, fill: c.ink }, gText);
  if (held) halo(t, 0.5, 2.55, yc);
}
LANES.forEach((lane, i) => {
  const top = laneTop[i];
  lane.rows.forEach((row, r) => {
    const yc = top + PAD + r * PITCH + PITCH / 2;
    rich(X0 - 0.8, yc + 0.84, row.label, { size: 2.3, anchor: "end", fill: COL[row.kind].label, weight: 600 }, gText);
    for (const b of row.bars || []) bar(mx(b.from), mx(b.to), yc, row.kind, b.text, b.held);
    if (row.pinned) {
      const xd = xe + 1.3;
      E("path", { d: `M${xd},${yc - 1.25} l1.25,1.25 l-1.25,1.25 l-1.25,-1.25 z`, fill: "#4B5563" }, undefined, gBars);
      const t = rich(xd - 1.8, yc + 0.84, row.pinned, { size: FS, anchor: "end", fill: "#374151" }, gText);
      halo(t, 0.5, 2.6, yc);
    }
  });
  if (lane.span) {
    const ys = top + PAD + lane.rows.length * PITCH + SPAN / 2, x1 = mx(lane.span.from), x2 = mx(lane.span.to);
    E("path", { d: `M${x1 + 0.4},${ys} H${x2 - 0.4}`, stroke: "#6B7280", "stroke-width": 0.3, "marker-end": Fig.marker(svg, "#6B7280") }, undefined, gBars);
    E("path", { d: `M${x2 - 0.4},${ys} H${x1 + 0.4}`, stroke: "#6B7280", "stroke-width": 0.3, "marker-end": Fig.marker(svg, "#6B7280") }, undefined, gBars);
    const t = rich((x1 + x2) / 2, ys + 0.8, lane.span.text, { size: FS, fill: "#4B5563" }, gText);
    halo(t, 0.8, 2.6, ys);
  }
});

// freeze labels
rich(xw + 0.6, BOTTOM + 3.3, "31 Mar 2026", { size: FS, anchor: "end", weight: 600 });
rich(xw + 0.6, BOTTOM + 6.0, "W0 freeze $t$_{1}", { size: FS, anchor: "end", fill: "#4B5563" });
rich(xt - 0.6, BOTTOM + 3.3, "30 Jun 2026", { size: FS, anchor: "start", weight: 600 });
rich(xt - 0.6, BOTTOM + 6.0, "$T$_{obs}, W1 freeze", { size: FS, anchor: "start", fill: "#4B5563" });

const H = BOTTOM + 6.9;
svg.setAttribute("viewBox", `0 0 165 ${H}`);
svg.setAttribute("height", H + "mm");
wrap.style.height = H + "mm";

// legend swatches (vector, no gradients or patterns)
(function () {
  const s = document.getElementById("sw-solid");
  Fig.el(s, "rect", { x: 0.15, y: 0.15, width: 2.35, height: 2.3, fill: "#FDE2B8" });
  Fig.el(s, "rect", { x: 2.5, y: 0.15, width: 2.35, height: 2.3, fill: "#D3E2FF" });
  Fig.el(s, "rect", { x: 0.15, y: 0.15, width: 4.7, height: 2.3, rx: 0.4, fill: "none", stroke: "#64748B", "stroke-width": 0.3 });
  const h = document.getElementById("sw-held");
  Fig.el(h, "rect", { x: 0.15, y: 0.15, width: 4.7, height: 2.3, rx: 0.4, fill: "#fff" });
  let d = ""; for (let x = -2.3; x < 5; x += 1.05) d += `M${Math.max(0.15, x)},${x < 0.15 ? 2.45 - (0.15 - x) : 2.45} L${Math.min(4.85, x + 2.3)},${x + 2.3 > 4.85 ? 0.15 + (x + 2.3 - 4.85) : 0.15} `;
  Fig.el(h, "path", { d, stroke: "#475569", "stroke-width": 0.3 });
  Fig.el(h, "rect", { x: 0.15, y: 0.15, width: 4.7, height: 2.3, rx: 0.4, fill: "none", stroke: "#475569", "stroke-width": 0.3 });
})();
</script>
</body>
</html>
