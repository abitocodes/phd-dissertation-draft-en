<!doctype html>
<!--
  Figure fig:data-overview of the thesis (Chapter 3, data sources and sampling); the source of Figures/data-overview.pdf.
  LaTeX cannot read HTML: edit this file, then run (from overleaf-github/)
      python Figures/html/render.py Figures/html/data-overview.html
  See Figures/html/README.md.

  What the figure shows: every kind of on-chain record used in the thesis, all from Arbitrum One, on one calendar
  from 1 October 2023 to 30 September 2026. The 18 months from October 2023 to March 2025 are drawn at a compressed
  scale (grey band); the 18 months from April 2025 to September 2026 at full scale. Brackets mark scan A (1 Oct 2023 to
  30 Jun 2026; the registered analysis scores all of it) and scan B (July to September 2026: the W1 labels). Dashed
  lines mark the freezes: 31 March 2026 (t1, the W0 freeze) and 30 June 2026 (T_obs, the W1 freeze). Each lane is one
  analysis; each bar is one kind of record (gold = ERC-20 Approval logs, ultramarine = ERC-20 Transfer logs, grey = all
  logs, transaction senders or code read over RPC) placed on the months it covers. Solid bars are inputs to scores,
  cohorts or same-window checks; hatched bars are kept out of the scores (labels counted after a freeze, or the
  importance from user accounts). The LANES list in the script holds the same content as data. Lanes, top to bottom
  (the bars, then the note on the right, which is kept short: the caption and the text of the section say the rest):
  1. Extraction: approval and transfer logs of scan A (Oct 2023 to Jun 2026, input) and scan B (Jul to Sep 2026, held out).
     Note: every approval and transfer log of the chain; the main analysis reads those of five tokens.
  2. Matched cohort selection: approvals from Jul 2025 to Jun 2026, five tokens, three owners. Note: contracts approved
     by at least three owners in the year before T_obs.
  3. Same-window analysis, matched cohort (n = 6,443): approvals (EndorseRank; allowance checks) and transfers (AWP;
     transfer and stability checks), Jul 2025 to Jun 2026. Note: events between contracts; both edge types give C-PR
     and S-PR. RQ1 and the same-window part of RQ4.
  4. Discovery-order test at T_obs and at t1: allowance and transfer edges between contracts (input) and, held out,
     I_A (allowances from user accounts) and I_T (transfers from user accounts), Jul 2025 to Jun 2026; at t1 the
     months Apr 2025 to Mar 2026. Note: the crawls read the edges between contracts; the events of user accounts, which
     no ordering reads, give the importance of a contract and mark the hot contracts. RQ2.
  5. Holdout W0, spender contracts (n = 7,864): approvals and transfers from Apr 2025 to Mar 2026 as score input (and
     the W0 cohort); held out from Apr to Jun 2026: new approval pairs and new senders. Note: contract spenders with a
     five-token allowance set in the year before t1; labels count every account. RQ3, RQ4.
  6. Registered window W1, spender contracts (n = 7,915): score input Jul 2025 to Jun 2026; held out Jul to Sep 2026:
     pairs and senders. Note: F1 and F2 of rule B on the contract graph's scores; W1 logs extracted after the
     registration. RQ3, RQ5.
  7. Account types and balances: senders (an address that sent a transaction in any block before 1 Oct 2026 is a user
     account), code (eth_getCode and smart-account calls at one pinned block, after the label windows), and the
     five-token transfers up to each freeze (owner balances). Note: transaction senders, addresses without code,
     EIP-7702 accounts and smart accounts are user accounts; other code is a contract. Balances also take the transfers
     before October 2023.
  Type: bar texts, notes and legend 7.5 pt, row and month labels 7.4 pt, subscripts 0.8em.

  Look (STYLE.md, "Calendars and periods"): the calendar of study-timeline (grey month letters over
  hairlines, bold years, dashed near-black freezes with their dates in bold at the foot). A solid bar is flat with
  square ends: Approval logs in the gold of the allowance layer with dark text, Transfer logs in solid ultramarine with
  white text (so the two differ in a greyscale print as well), every other record in pale grey with a grey line. A
  hatched bar is white with thin diagonal lines of its colour and a line around it, its name on a white box. The
  lanes are parted by hairlines; the compressed months lie on the pale plate; the notes are bold near black for the
  name of the analysis and grey for the rest, variables in Palatino italic.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data overview</title>
<link rel="stylesheet" href="style.css">
<script src="fig.js"></script>
<style>
.wrap { position:relative; width:165mm; }
#chart { display:block; }
.note { position:absolute; left:95.7mm; width:69.3mm; font-size:7.5pt; line-height:1.17; color:var(--muted); }
.note i.v { line-height:0; }               /* a variable takes no line height of its own: the lanes are measured from the notes */
.legend2 { display:grid; grid-template-columns:12mm 1fr; row-gap:0.5mm; margin-top:0.6mm; font-size:7.5pt; line-height:1.2; color:var(--muted); }
.legend2 .k { font-weight:700; color:var(--ink); }
.legend2 .items { display:flex; flex-wrap:wrap; gap:0.5mm 2.8mm; align-items:center; }
.legend2 .items span { display:inline-flex; align-items:center; gap:1.1mm; }
.legend2 svg { flex:none; display:block; }
.sw { display:inline-block; width:5mm; height:2.6mm; }
.sw.allow { background:var(--allow-fill); }
.sw.transfer { background:var(--transfer); }
.sw.other { background:var(--count-bg); border:0.25mm solid var(--count); }
</style>
</head>
<body>
<div class="fig">
  <div class="wrap" id="wrap">
    <svg id="chart" width="165mm" height="100mm" viewBox="0 0 165 100"></svg>
  </div>
  <div class="legend2">
    <div class="k">Records</div>
    <div class="items">
      <span><i class="sw allow"></i>ERC-20 Approval logs</span>
      <span><i class="sw transfer"></i>ERC-20 Transfer logs</span>
      <span><i class="sw other"></i>all logs, transaction senders, or code read over RPC</span>
    </div>
    <div class="k">Bars</div>
    <div class="items">
      <span><svg id="sw-solid" width="5mm" height="2.6mm" viewBox="0 0 5 2.6"></svg>solid: input to scores, cohorts or same-window checks</span>
      <span><svg id="sw-held" width="5mm" height="2.6mm" viewBox="0 0 5 2.6"></svg>hatched: kept out of the scores (labels after a freeze; importance from user accounts)</span>
      <span><svg width="2mm" height="3mm" viewBox="0 0 2 3"><path d="M1,0 V3" style="stroke:var(--ink)" stroke-width="0.4" stroke-dasharray="0.9 0.6"/></svg>dashed: freeze</span>
    </div>
  </div>
</div>

<script>
// ---- content: one lane per analysis; bars are [from, to] in [year, month] (first day of the month), kind = allow | transfer | other
// In a text: $x$ a variable, _{i} an index, `code` an identifier of the chain (Fig.rich).
const LANES = [
  { title: "Extraction.",
    note: "Every approval and transfer log of the chain; the main analysis reads those of five tokens.",
    rows: [{ label: "Logs", kind: "other", bars: [
      { from: [2023, 10], to: [2026, 7], text: "approval and transfer logs (scan A)" },
      { from: [2026, 7], to: [2026, 10], text: "scan B", held: true }] }] },
  { title: "Matched cohort selection.",
    note: "Contracts approved by at least three owners in the year before <i class=\"v\">T</i><sub>obs</sub>.",
    rows: [{ label: "Approval", kind: "allow", bars: [{ from: [2025, 7], to: [2026, 7], text: "five tokens, three owners" }] }] },
  { title: "Same-window analysis, matched cohort (<i class=\"v\">n</i>&nbsp;=&nbsp;6,443).",
    note: "Events between contracts; both edge types give <span class=\"nb\">C-PR</span> and <span class=\"nb\">S-PR</span>. RQ1 and the same-window part of RQ4.",
    rows: [
      { label: "Approval", kind: "allow", bars: [{ from: [2025, 7], to: [2026, 7], text: "EndorseRank; allowance checks" }] },
      { label: "Transfer", kind: "transfer", bars: [{ from: [2025, 7], to: [2026, 7], text: "AWP; transfer and stability checks" }] }] },
  { title: "Discovery-order test at <i class=\"v\">T</i><sub>obs</sub> and at <i class=\"v\">t</i><sub>1</sub>.",
    note: "The crawls read the edges between contracts. The events of user accounts, which no ordering reads, give the importance of a contract and mark the hot contracts. RQ2.",
    rows: [
      { label: "Approval", kind: "allow", bars: [{ from: [2025, 7], to: [2026, 7], text: "allowance edges between contracts" }] },
      { label: "Transfer", kind: "transfer", bars: [{ from: [2025, 7], to: [2026, 7], text: "transfer edges between contracts" }] },
      { label: "Approval", kind: "allow", bars: [{ from: [2025, 7], to: [2026, 7], text: "$I$_{A}: allowances from user accounts", held: true }] },
      { label: "Transfer", kind: "transfer", bars: [{ from: [2025, 7], to: [2026, 7], text: "$I$_{T}: transfers from user accounts", held: true }] }],
    span: { from: [2025, 4], to: [2026, 4], text: "at $t$_{1}: these months" } },
  { title: "Holdout W0, spender contracts (<i class=\"v\">n</i>&nbsp;=&nbsp;7,864).",
    note: "Contract spenders with a five-token allowance set in the year before <i class=\"v\">t</i><sub>1</sub>; labels count every account. RQ3, RQ4.",
    rows: [
      { label: "Approval", kind: "allow", bars: [{ from: [2025, 4], to: [2026, 4], text: "score input; W0 cohort" }, { from: [2026, 4], to: [2026, 7], text: "pairs", held: true }] },
      { label: "Transfer", kind: "transfer", bars: [{ from: [2025, 4], to: [2026, 4], text: "score input" }, { from: [2026, 4], to: [2026, 7], text: "senders", held: true }] }] },
  { title: "Registered window W1, spender contracts (<i class=\"v\">n</i>&nbsp;=&nbsp;7,915).",
    note: "F1 and F2 of rule B on the contract graph’s scores; W1 logs extracted after the registration. RQ3, RQ5.",
    rows: [
      { label: "Approval", kind: "allow", bars: [{ from: [2025, 7], to: [2026, 7], text: "score input" }, { from: [2026, 7], to: [2026, 10], text: "pairs", held: true }] },
      { label: "Transfer", kind: "transfer", bars: [{ from: [2025, 7], to: [2026, 7], text: "score input" }, { from: [2026, 7], to: [2026, 10], text: "senders", held: true }] }] },
  { title: "Account types and balances.",
    note: "Transaction senders, addresses without code, EIP-7702 accounts and smart accounts are user accounts; other code is a contract. Balances also take the transfers before October 2023.",
    rows: [
      { label: "Senders", kind: "other", bars: [{ from: [2023, 10], to: [2026, 10], text: "sent a transaction in any block before 1 Oct 2026: user account" }] },
      { label: "Code", kind: "other", pinned: "`eth_getCode` and smart-account calls at one pinned block" },
      { label: "Transfer", kind: "transfer", bars: [{ from: [2023, 10], to: [2026, 7], text: "five-token transfers up to each freeze: owner balances" }] }] },
];

// ---- geometry (mm)
const X0 = 12.8, COMP = 0.58, FULL = 3.82;                 // timeline start; mm per compressed and per full month
const mx = ([y, m]) => { const i = (y - 2023) * 12 + (m - 10); return i <= 18 ? X0 + i * COMP : X0 + 18 * COMP + (i - 18) * FULL; };
const xa = mx([2023, 10]), xq = mx([2025, 4]), xj = mx([2026, 1]), xw = mx([2026, 4]), xt = mx([2026, 7]), xe = mx([2026, 10]);
const HEAD = 11.2, PITCH = 4.0, BAR = 3.4, PAD = 0.75, SPAN = 3.5;
const FS = 2.65, FL = 2.6;                                 // text 2.65 mm = 7.5 pt; row and month labels 7.4 pt
const CAP = 0.36;                                          // half the height of a capital, in em: centres a line of text on a bar
const C = Fig.C;
// a solid bar is flat: Approval logs gold with dark text, Transfer logs ultramarine with white text, the rest pale
// grey with a grey line; a hatched bar takes the line colour of its kind
const COL = { allow: { fill: C.allowFill, line: C.allow, ink: C.allowInk, on: C.allowInk },
              transfer: { fill: C.transfer, line: C.transfer, ink: C.transferInk, on: "#fff" },
              other: { fill: C.countBg, line: C.count, ink: C.countInk, on: C.countInk, edge: true } };
const svg = document.getElementById("chart"), wrap = document.getElementById("wrap");
const E = (tag, a, txt, parent) => Fig.el(parent || svg, tag, a, txt);
const rich = (x, y, s, o, parent) => Fig.rich(parent || svg, x, y, s, Object.assign({ size: FS, anchor: "middle", fill: C.text }, o));

// white box behind a text element (drawn just below it)
function halo(t, padX = 0.6, h = 2.9, yc) {
  const bb = t.getBBox();
  const r = E("rect", { x: bb.x - padX, y: (yc ?? bb.y + bb.height / 2) - h / 2, width: bb.width + 2 * padX, height: h, fill: "#fff" });
  t.parentNode.insertBefore(r, t);
}
// hatched rectangle as clipped vector lines (no SVG pattern: Chrome prints patterns as page-size images)
let clipN = 0;
function hatch(parent, x, y, w, h, color) {
  const id = "clip" + (clipN++);
  const cp = E("clipPath", { id }, undefined, Fig.defs(svg));
  E("rect", { x, y, width: w, height: h }, undefined, cp);
  E("rect", { x, y, width: w, height: h, fill: "#fff" }, undefined, parent);
  const g = E("g", { "clip-path": `url(#${id})` }, undefined, parent);
  let d = ""; for (let s = x - h; s < x + w; s += 1.2) d += `M${s},${y + h} L${s + h},${y} `;
  E("path", { d, stroke: color, "stroke-width": 0.26 }, undefined, g);
  E("rect", { x, y, width: w, height: h, fill: "none", stroke: color, "stroke-width": 0.35, "stroke-linejoin": "round" }, undefined, parent);
}

// ---- notes first, to measure their heights
const PX = 96 / 25.4;
const notes = LANES.map(l => { const d = document.createElement("div"); d.className = "note"; d.innerHTML = `<b>${l.title}</b> ${l.note}`; wrap.appendChild(d); return d; });
const laneTop = [];
let y = HEAD;
LANES.forEach((lane, i) => {
  const rowsH = lane.rows.length * PITCH + (lane.span ? SPAN : 0);
  const noteH = notes[i].offsetHeight / PX;
  const h = Math.max(rowsH, noteH) + 2 * PAD;
  laneTop.push(y);
  notes[i].style.top = (y + PAD - 0.2) + "mm";
  y += h;
});
const BOTTOM = y;

// ---- layers: background, grid, freezes, then bars and labels on top
const gBack = E("g", {}), gBars = E("g", {}), gText = E("g", {});
E("rect", { x: xa, y: HEAD - 0.5, width: xq - xa, height: BOTTOM - HEAD + 0.5, fill: C.plate }, undefined, gBack);     // the compressed months
for (let i = 0; i <= 18; i++) { const x = xq + i * FULL; E("path", { d: `M${x},${HEAD - 0.5} V${BOTTOM}`, stroke: C.plate2, "stroke-width": 0.2 }, undefined, gBack); }
for (const x of [mx([2024, 1]), mx([2025, 1])]) E("path", { d: `M${x},${HEAD - 0.5} V${BOTTOM}`, stroke: C.hair, "stroke-width": 0.2 }, undefined, gBack);
laneTop.forEach((top, i) => { if (i) E("path", { d: `M0,${top} H165`, stroke: C.hair, "stroke-width": 0.25 }, undefined, gBack); });
E("path", { d: `M0,${BOTTOM} H165`, stroke: C.hair, "stroke-width": 0.25 }, undefined, gBack);
for (const x of [xw, xt]) E("path", { d: `M${x},${HEAD - 0.5} V${BOTTOM + 0.7}`, stroke: C.ink, "stroke-width": 0.4, "stroke-dasharray": "0.9 0.6" }, undefined, gBack);

// header: brackets over the two scans, years, months
function bracket(x1, x2, yb, label) {
  const m = (x1 + x2) / 2;
  E("path", { d: `M${x1},${yb + 1} V${yb} H${x2} V${yb + 1} M${m},${yb} V${yb - 0.8}`, fill: "none", stroke: C.count, "stroke-width": 0.3 });
  rich(m, yb - 1.6, label, { fill: C.text });
}
bracket(xa + 0.2, xt - 0.2, 3.1, "scan A (the registered analysis scores all of it)");
bracket(xt + 0.2, xe - 0.2, 3.1, "scan B: W1 labels");
rich((xa + xq) / 2, 7.1, "Oct 2023 – Mar 2025", { size: 2.5, weight: 700, fill: C.ink });
rich((xq + xj) / 2, 7.1, "2025", { weight: 700, fill: C.ink });
rich((xj + xe) / 2, 7.1, "2026", { weight: 700, fill: C.ink });
rich(xq - 1.5, 10.1, "compressed", { size: 2.5, fill: C.muted, anchor: "end" });
"AMJJASONDJFMAMJJAS".split("").forEach((c, i) => rich(xq + (i + 0.5) * FULL, 10.1, c, { size: FL, fill: C.muted }));
E("path", { d: `M${xq - 0.9},10.8 l0.55,-1.5 M${xq - 0.25},10.8 l0.55,-1.5`, stroke: C.count, "stroke-width": 0.3 });

// bars, row labels, the t1 span and the pinned block
function bar(x1, x2, yc, kind, text, held) {
  const c = COL[kind], x = x1 + 0.12, w = x2 - x1 - 0.24, yb = yc - BAR / 2;
  if (held) hatch(gBars, x, yb, w, BAR, c.line);
  else E("rect", { x, y: yb, width: w, height: BAR, fill: c.fill, stroke: c.edge ? c.line : null, "stroke-width": c.edge ? 0.25 : null }, undefined, gBars);
  const t = rich((x1 + x2) / 2, yc + FS * CAP, text, { fill: held ? c.ink : c.on, weight: 600 }, gText);
  if (held) halo(t, 0.4, BAR - 0.3, yc);                 // the height of the bar inside its line; narrow, so that the hatching of a three-month bar still shows
}
LANES.forEach((lane, i) => {
  const top = laneTop[i];
  lane.rows.forEach((row, r) => {
    const yc = top + PAD + r * PITCH + PITCH / 2;
    rich(X0 - 0.8, yc + FL * CAP, row.label, { size: FL, anchor: "end", fill: COL[row.kind].ink, weight: 700 }, gText);
    for (const b of row.bars || []) bar(mx(b.from), mx(b.to), yc, row.kind, b.text, b.held);
    if (row.pinned) {
      const xd = xe + 1.3;
      E("path", { d: `M${xd},${yc - 1.25} l1.25,1.25 l-1.25,1.25 l-1.25,-1.25 z`, fill: C.count }, undefined, gBars);
      const t = rich(xd - 1.8, yc + FS * CAP, row.pinned, { anchor: "end", fill: C.countInk }, gText);   // free-standing text: regular weight
      halo(t, 0.5, 2.9, yc);
    }
  });
  if (lane.span) {
    const ys = top + PAD + lane.rows.length * PITCH + SPAN / 2, x1 = mx(lane.span.from), x2 = mx(lane.span.to);
    E("path", { d: `M${x1 + 0.4},${ys} H${x2 - 0.4}`, stroke: C.count, "stroke-width": 0.3, "marker-end": Fig.marker(svg, C.count) }, undefined, gBars);
    E("path", { d: `M${x2 - 0.4},${ys} H${x1 + 0.4}`, stroke: C.count, "stroke-width": 0.3, "marker-end": Fig.marker(svg, C.count) }, undefined, gBars);
    const t = rich((x1 + x2) / 2, ys + FS * CAP - 0.05, lane.span.text, { fill: C.muted }, gText);
    halo(t, 0.8, 2.9, ys);
  }
});

// freeze labels: the date in bold, what freezes there below it
rich(xw + 0.6, BOTTOM + 3.4, "31 Mar 2026", { anchor: "end", weight: 700, fill: C.ink });
rich(xw + 0.6, BOTTOM + 6.3, "W0 freeze $t$_{1}", { anchor: "end", fill: C.muted });
rich(xt - 0.6, BOTTOM + 3.4, "30 Jun 2026", { anchor: "start", weight: 700, fill: C.ink });
rich(xt - 0.6, BOTTOM + 6.3, "$T$_{obs}, W1 freeze", { anchor: "start", fill: C.muted });

const H = BOTTOM + 7.45;
svg.setAttribute("viewBox", `0 0 165 ${H}`);
svg.setAttribute("height", H + "mm");
wrap.style.height = H + "mm";

// legend swatches (vector, no gradients or patterns)
(function () {
  const s = document.getElementById("sw-solid");
  Fig.el(s, "rect", { x: 0, y: 0.15, width: 2.5, height: 2.3, fill: C.allowFill });
  Fig.el(s, "rect", { x: 2.5, y: 0.15, width: 2.5, height: 2.3, fill: C.transfer });
  const h = document.getElementById("sw-held");
  Fig.el(h, "rect", { x: 0.15, y: 0.15, width: 4.7, height: 2.3, fill: "#fff" });
  let d = ""; for (let x = -2.3; x < 5; x += 1.05) d += `M${Math.max(0.15, x)},${x < 0.15 ? 2.45 - (0.15 - x) : 2.45} L${Math.min(4.85, x + 2.3)},${x + 2.3 > 4.85 ? 0.15 + (x + 2.3 - 4.85) : 0.15} `;
  Fig.el(h, "path", { d, stroke: C.count, "stroke-width": 0.26 });
  Fig.el(h, "rect", { x: 0.15, y: 0.15, width: 4.7, height: 2.3, fill: "none", stroke: C.count, "stroke-width": 0.3 });
})();
</script>
</body>
</html>
