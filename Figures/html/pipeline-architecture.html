<!doctype html>
<!--
  Figure fig:pipeline-architecture of the thesis (Chapter 3, pipeline architecture); the source of
  Figures/pipeline-architecture.pdf. LaTeX cannot read HTML: edit this file, then run (from overleaf-github/)
      python Figures/html/render.py Figures/html/pipeline-architecture.html
  See Figures/html/README.md.

  What the figure shows: the pipeline from public logs to the tables, in two parts.
  Remote (acquisition, in the study's BigQuery project), left to right: BigQuery public logs -> extract logs (scans A and
  B; topic filter) -> type end points (transaction senders; code over RPC) -> balances, pair tables between contracts,
  cohorts and labels. The resulting tables are downloaded and never changed.
  Local (reproducible from the downloaded tables): load tables, then four branches:
    build edge lists -> PageRank scores (EndorseRank, AWP, C-PR, S-PR) -> alignment and benchmarks;
    checks (the same-window proxies: the transfer and stability proxies arrive with the downloaded tables, the
      allowance checks are computed here from the capped allowances) -> alignment and benchmarks;
    temporal holdouts (W0 and W1);
    discovery-order test (crawls at both freezes);
  and the alignment and benchmarks, the holdouts and the discovery-order test feed the export of tables and figures.
  The label of the local band stands to the right of the download connector, which enters the band beside it.

  Look: each part is a pale grey plate under a Palatino heading with a solid dot; a step is a white box
  with a solid bar of its colour on the left (grey: neutral step; verdigris: contracts; violet: the scores; the colours
  of RQ1, RQ3 and RQ2 for the checks and alignment, the holdouts and the discovery-order test) and, where the figure
  of the thesis has a pictogram, the same pictogram in white on a ringed disc of that colour; the connectors are thin
  grey lines with a dot where they branch or join.
  Sizes and places: the four remote steps have one size and stand at equal distances. In the local part the four rows
  of small steps have one height and stand at equal distances; Load, Alignment and the export have one size, two rows
  high (Alignment over rows 1 and 2, Load and the export over rows 2 and 3, so that both stand at the middle of the
  four rows, where the line from Load meets the middle of its fan and the export leaves the middle of its own).
  Every box stands 2.6 mm inside its plate, and the boxes at the left and right ends of the two plates share their
  outer edges.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pipeline overview</title>
<link rel="stylesheet" href="style.css">
<script src="fig.js"></script>
</head>
<body>
<div class="fig"><svg id="s" width="165mm" height="66mm" viewBox="0 0 165 66"></svg></div>
<script>
const svg = document.getElementById("s"), C = Fig.C;
const E = (tag, a, txt, parent) => Fig.el(parent || svg, tag, a, txt);
const T = (x, y, s, o = {}, parent) => Fig.text(parent || svg, x, y, s, o);
const LINE = C.count;

// a step: a white box, a solid bar of the step's colour on its left, the pictogram on a ringed disc, a bold title
// and up to two lines of detail. The whole block, from the capitals of the title to the descenders of the last
// line, is centred in the box.
function box(x, y, w, h, title, lines, color, ic) {
  E("rect", { x, y, width: w, height: h, rx: 0.4, fill: C.paper, stroke: C.rule, "stroke-width": 0.25 });
  E("rect", { x: x - 0.125, y: y - 0.125, width: 1.3, height: h + 0.25, fill: color });
  const tx = x + (ic ? 7.0 : 2.7);
  if (ic) Fig.medalAt(svg, ic, color, x + 4.0, y + h / 2, 4.9);
  const n = lines.length, lh = 2.8, cap = 1.85, desc = n ? 0.45 : 0;   // line pitch, capital height, descender (mm)
  const base = y + (h - (cap + n * lh + desc)) / 2 + cap;               // baseline of the title
  T(tx, base, title, { size: 2.6, weight: 700, fill: C.ink });
  lines.forEach((l, i) => T(tx, base + (i + 1) * lh, l, { size: 2.5, fill: C.muted }));   // 2.5 mm = 7.1 pt
  return { x, y, w, h, cx: x + w / 2, cy: y + h / 2, r: x + w, b: y + h };
}
function arrow(d, color = LINE, dash) {
  E("path", { d, fill: "none", stroke: color, "stroke-width": 0.42, "stroke-dasharray": dash, "stroke-linejoin": "round", "marker-end": Fig.marker(svg, color) });
}
const dot = (x, y, color = LINE) => E("circle", { cx: x, cy: y, r: 0.62, fill: color });
// a part of the pipeline: a pale plate; its heading in Palatino after a solid dot. lx: where the heading starts
// (by default its dot begins at the left edge of the boxes, 2.6 mm inside the plate less the half line of a box)
function zone(x, y, w, h, label, lx = x + 2.425) {
  E("rect", { x, y, width: w, height: h, rx: 0.6, fill: C.plate });
  E("circle", { cx: lx + 0.95, cy: y + 2.55, r: 0.9, fill: C.ink });
  T(lx + 2.9, y + 3.6, label, { size: 3.15, serif: true, fill: C.ink });
}

// The boxes of both plates stand between x = 3 and x = 162, 2.6 mm inside the plates (0.4 to 164.6). Two boxes that
// follow each other stand 4.2 mm apart, which leaves an arrow of 3.1 mm; a line that branches or joins stands 3.5 mm
// from the box it leaves and 3.8 mm from the boxes it reaches.

// ---- remote part: four steps of one size (36.6 by 11.4 mm)
zone(0.4, 0.4, 164.2, 19.2, "Remote: acquisition in the study’s BigQuery project");
const SLATE = C.count, TEAL = C.contract;
const RW = 36.6, RH = 11.4, RY = 5.6;
const r1 = box(3, RY, RW, RH, "BigQuery", ["public logs of", "Arbitrum One"], SLATE, "database");
const r2 = box(43.8, RY, RW, RH, "Extract logs", ["scans A and B;", "topic filter"], SLATE, "doc");
const r3 = box(84.6, RY, RW, RH, "Type end points", ["transaction senders;", "code over RPC"], TEAL, "contract");
const r4 = box(125.4, RY, RW, RH, "Tables", ["balances; pairs between", "contracts; cohorts, labels"], TEAL, "database");
arrow(`M${r1.r + 0.4},${r1.cy} H${r2.x - 0.7}`); arrow(`M${r2.r + 0.4},${r2.cy} H${r3.x - 0.7}`); arrow(`M${r3.r + 0.4},${r3.cy} H${r4.x - 0.7}`);

// ---- local part (its heading starts to the right of the download connector, which comes down at the middle of Load)
// Four rows of small steps, 7.4 mm high and 1.4 mm apart, the first as far below the top of its plate as the remote
// steps are below theirs. Load, Alignment and the export are one size, 25 by 16.2 mm (two rows).
const LOADX = 3, LOADW = 25;
zone(0.4, 24.0, 164.2, 41.6, "Local: reproducible from the downloaded tables", LOADX + LOADW / 2 + 2.4);
const rowY = [29.2, 38, 46.8, 55.6], H = 7.4, BIG = 16.2;  // rows: edge lists and scores, checks, holdouts, discovery
const VIO = C.coupled, CYAN = C.rq1, PINK = C.rq3, GREEN = C.rq2;
const COL1 = 35.3, COL2 = 61.9, COL3 = 104.7, RIGHT = 129.7;   // left edges of the three columns of local boxes; their right end
const load = box(LOADX, rowY[1], LOADW, BIG, "Load", ["tables"], SLATE, "database");
const edges = box(COL1, rowY[0], 22.4, H, "Build edge lists", [], TEAL);
const scores = box(COL2, rowY[0], 38.6, H, "PageRank scores", ["EndorseRank, AWP, C-PR, S-PR"], VIO);
const align = box(COL3, rowY[0], 25, BIG, "Alignment", ["& benchmarks"], CYAN, "bars");
const proxy = box(COL2, rowY[1], 38.6, H, "Checks", ["same-window proxies"], CYAN);
const hold = box(COL2, rowY[2], RIGHT - COL2, H, "Temporal holdouts", ["W0 and W1"], PINK, "calendar");
const disc = box(COL2, rowY[3], RIGHT - COL2, H, "Discovery-order test", ["crawls at both freezes"], GREEN, "search");
const exp = box(137, rowY[1], 25, BIG, "Tables &", ["figures export"], SLATE, "doc");

// download: from the remote tables to Load tables; its note stands at the middle of the horizontal run
arrow(`M${r4.cx},${r4.b + 0.4} V21.8 H${load.cx} V${load.y - 0.7}`, C.text);
const dl = T((load.cx + r4.cx) / 2, 22.66, "downloaded once; never changed", { size: 2.5, fill: C.text, anchor: "middle" });
{ const bb = dl.getBBox(); const r = E("rect", { x: bb.x - 1.2, y: 20.4, width: bb.width + 2.4, height: 2.8, fill: C.paper }); svg.insertBefore(r, dl); }

// fan-out from Load tables: the line from Load meets the middle of the fan
const fx = 31.5;
E("path", { d: `M${load.r + 0.3},${load.cy} H${fx}`, stroke: LINE, "stroke-width": 0.42 });
E("path", { d: `M${fx},${edges.cy} V${disc.cy}`, stroke: LINE, "stroke-width": 0.42, "stroke-linecap": "square" });
arrow(`M${fx},${edges.cy} H${edges.x - 0.7}`);
arrow(`M${fx},${proxy.cy} H${proxy.x - 0.7}`);
arrow(`M${fx},${hold.cy} H${hold.x - 0.7}`);
arrow(`M${fx},${disc.cy} H${disc.x - 0.7}`);
dot(fx, load.cy);
// main line
arrow(`M${edges.r + 0.4},${edges.cy} H${scores.x - 0.7}`);
arrow(`M${scores.r + 0.4},${scores.cy} H${align.x - 0.7}`);
arrow(`M${proxy.r + 0.4},${proxy.cy} H${align.x - 0.7}`);
// fan-in to the export
const gx = 133.2;
E("path", { d: `M${align.r + 0.3},${align.cy} H${gx} M${hold.r + 0.3},${hold.cy} H${gx} M${disc.r + 0.3},${disc.cy} H${gx} M${gx},${align.cy} V${disc.cy}`, stroke: LINE, "stroke-width": 0.42, fill: "none", "stroke-linecap": "square" });
arrow(`M${gx},${exp.cy} H${exp.x - 0.7}`);
dot(gx, exp.cy);
</script>
</body>
</html>
