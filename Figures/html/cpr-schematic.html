<!doctype html>
<!--
  Figure fig:cpr-schematic of the thesis (Chapter 3, coupled operator C-PR); the source of Figures/cpr-schematic.pdf.
  LaTeX cannot read HTML: edit this file, then run (from overleaf-github/)
      python Figures/html/render.py Figures/html/cpr-schematic.html
  See Figures/html/README.md.

  What the figure shows: one step of the coupled walk C-PR (Equation eq:coupled-transition) on five contracts.
  Allowance edges are gold and solid, transfer edges blue and dashed; each edge is labeled with its transition
  probability before damping. Edges: x -> v (allowance, 1); u -> v (allowance, lambda); u -> w (transfer, 1 - lambda);
  y -> w (transfer, 1). Contract u has out-edges in both layers and mixes them with weights lambda and 1 - lambda;
  x and y have out-edges in one layer only and follow it whatever lambda is. With probability 1 - d the walk restarts at
  a uniformly chosen contract (named in the legend only; no restart is drawn on the graph).

  Look: the contracts are flat verdigris squares inside a thin frame, their names in white Palatino
  italic; the frame of u, the one contract with out-edges in both layers, is violet and heavier. An allowance edge is a
  solid band of sand gold, a transfer edge a thin dashed line of ultramarine, so the two differ in width, dash and
  lightness as well as in hue. The probabilities stand in Palatino in the ink of their edge. The legend repeats each
  mark as it is drawn: the band, the dashed line, the node u in its violet frame, the nodes x and y, and the grey
  dashed arc of a restart.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>One step of C-PR</title>
<link rel="stylesheet" href="style.css">
<script src="fig.js"></script>
<style>
.row { display:grid; grid-template-columns:76mm 1fr; column-gap:4mm; align-items:center; }
.side { display:flex; flex-direction:column; gap:1.7mm; font-size:7.1pt; line-height:1.27; color:var(--muted); }
.side .it { display:grid; grid-template-columns:11mm 1fr; align-items:center; column-gap:1.9mm; }
.side .it > svg, .side .it > .smp { justify-self:center; }
.side b.a { color:var(--allow-ink); }
.side b.t { color:var(--transfer-ink); }
/* a node as the drawing has it, small: a verdigris square in a thin frame, its name in white Palatino italic;
   the frame of u is violet and heavier, as in the drawing. The script below draws each <span class="nd"> as one
   SVG, so that the square stands at the centre of its frame (as two CSS boxes it stood 0.13 mm off in print). */
.smp { display:inline-flex; align-items:center; gap:0.45mm; }
.nd { font-size:0; color:transparent; }
</style>
</head>
<body>
<div class="fig">
  <div class="row">
    <svg id="g" width="76mm" height="34.4mm" viewBox="0 0 76 34.4"></svg>
    <div class="side">
      <div class="it"><svg width="10mm" height="3mm" viewBox="0 0 10 3"><path d="M0.2,1.5 H8.2" style="stroke:var(--allow-band)" stroke-width="1.05"/><path d="M6.9,0.35 L9.95,1.5 L6.9,2.65 L7.65,1.5z" style="fill:var(--allow-band)"/></svg>
        <span><b class="a">allowance edge</b>, row of <i class="v">P</i><sub>A</sub></span></div>
      <div class="it"><svg width="10mm" height="3mm" viewBox="0 0 10 3"><path d="M0.2,1.5 H8.3" style="stroke:var(--transfer)" stroke-width="0.55" stroke-dasharray="1.2 0.75"/><path d="M7.7,0.66 L9.95,1.5 L7.7,2.34 L8.25,1.5z" style="fill:var(--transfer)"/></svg>
        <span><b class="t">transfer edge</b>, row of <i class="v">P</i><sub>T</sub></span></div>
      <div class="it"><span class="smp"><span class="nd both">u</span></span>
        <span>out-edges in both layers: the walk mixes them with <i class="v">λ</i> and <span class="m">1 − <i>λ</i></span></span></div>
      <div class="it"><span class="smp"><span class="nd">x</span>, <span class="nd">y</span></span>
        <span>out-edges in one layer only: the walk follows it whatever <i class="v">λ</i> is</span></div>
      <div class="it"><svg width="10mm" height="3.6mm" viewBox="0 0 10 3.6">
          <defs><marker id="mr" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="4.1" markerHeight="4.1" orient="auto"><path d="M0.2,1.3 L10,5 L0.2,8.7 L2.6,5 z" style="fill:var(--user)"/></marker></defs>
          <path d="M0.6,3 C3,-0.5 6.5,-0.5 9,2.6" fill="none" style="stroke:var(--user)" stroke-width="0.45" stroke-dasharray="1.1 0.8" marker-end="url(#mr)"/></svg>
        <span>with probability <span class="m">1 − <i>d</i></span>: restart at a uniformly chosen contract</span></div>
    </div>
  </div>
</div>
<script>
(function () {
  const svg = document.getElementById("g"), C = Fig.C;
  const h = 3.3, ring = 0.72, hr = h + ring;                  // half size of a node and of its frame
  const N = { x: [4.5, 4.5], u: [4.5, 17.3], y: [4.5, 30.1], v: [71.5, 9.3], w: [71.5, 25.3] };
  const ALLOW = { color: C.allowBand, width: 1.05, headSize: 3.1 };          // a solid band of gold
  const TRANS = { color: C.transfer, width: 0.55, dash: "1.2 0.75" };        // a dashed line of blue
  // An edge from a to b with its probability. from: where it leaves a, as an offset from the centre of a (the two
  // edges of u leave it apart); to: where it meets b, so that two arrows do not share one point. pos: where the
  // label stands along the edge; side: its baseline above (negative) or below the edge, in mm.
  const edge = (a, b, kind, label, pos, side, from, to) => {
    const p = [N[a][0], N[a][1] + from], q = [N[b][0], N[b][1] + to];
    Fig.edge(svg, p, q, Object.assign({ half: hr, halfFrom: hr + (a === "u" ? 0.25 : 0), gap: 0.6 }, kind));
    const lx = p[0] + (q[0] - p[0]) * pos, ly = p[1] + (q[1] - p[1]) * pos + side;
    Fig.rich(svg, lx, ly, label, { size: 3.2, anchor: "middle", fill: kind === ALLOW ? C.allowInk : C.transferInk });
  };
  edge("x", "v", ALLOW, "#1#", 0.5, -1.9, 0, -1.6);
  edge("u", "v", ALLOW, "$λ$", 0.4, -1.9, -1.1, 1.6);
  edge("u", "w", TRANS, "#1 − #$λ$", 0.4, 4.0, 1.1, -1.6);
  edge("y", "w", TRANS, "#1#", 0.5, 3.8, 0, 1.6);
  // the contracts: a flat square in a thin frame; the frame of u, which has out-edges in both layers, is violet
  for (const [id, [x, y]] of Object.entries(N)) {
    const both = id === "u";
    // (round joins: PyMuPDF widens the box of a mitred stroke by its miter limit, which would widen the crop)
    Fig.el(svg, "rect", { x: x - hr, y: y - hr, width: 2 * hr, height: 2 * hr, rx: h * 0.2 + ring * 0.9, fill: C.paper,
      stroke: both ? C.coupled : C.contract, "stroke-width": both ? 0.6 : 0.2, "stroke-linejoin": "round" });
    Fig.node(svg, x, y, { half: h, fill: C.contract, keyline: 0, label: id, labelItalic: true, labelSize: 4.1 });
  }
  // the nodes of the legend, drawn as those above: a square of 2.9 mm, its frame 0.52 mm off it (0.2 mm wide; the
  // violet frame of u 0.5 mm), the name in 7.8 pt
  for (const s of document.querySelectorAll(".nd")) {
    const both = s.classList.contains("both"), id = s.textContent.trim();
    const hh = 1.45, fr = hh + 0.52, sw = both ? 0.5 : 0.2, half = fr + sw / 2;
    const m = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    m.setAttribute("viewBox", `${-half} ${-half} ${2 * half} ${2 * half}`);
    m.setAttribute("width", (2 * half).toFixed(2) + "mm");
    m.setAttribute("height", (2 * half).toFixed(2) + "mm");
    m.setAttribute("style", "flex:none;display:block");
    Fig.el(m, "rect", { x: -fr, y: -fr, width: 2 * fr, height: 2 * fr, rx: 0.65, fill: C.paper,
      stroke: both ? C.coupled : C.contract, "stroke-width": sw, "stroke-linejoin": "round" });
    Fig.node(m, 0, 0, { half: hh, fill: C.contract, keyline: 0, rx: 0.4, label: id, labelItalic: true, labelSize: 2.75 });
    s.replaceWith(m);
  }
})();
</script>
</body>
</html>
